<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>StockScan Inventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f5f6;--cd:#fff;--tx:#14262b;--mu:#62757b;--bd:#dde4e6;--pr:#0b5d6b;--pt:#fff;--wb:#fff1d6;--wt:#8a4b00;--rd:#b42318;--sh:#e8eef0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1e;--cd:#17282c;--tx:#e6f0f2;--mu:#93a9ae;--bd:#27403f;--pr:#4fc3d4;--pt:#06232a;--wb:#3a2b0d;--wt:#ffc56b;--rd:#ff8a80;--sh:#1d3236;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b1e;--cd:#17282c;--tx:#e6f0f2;--mu:#93a9ae;--bd:#27403f;--pr:#4fc3d4;--pt:#06232a;--wb:#3a2b0d;--wt:#ffc56b;--rd:#ff8a80;--sh:#1d3236;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif;padding:0 0 84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pr);color:var(--pt);display:flex;gap:10px;align-items:center;padding:10px 14px}
header b{font-size:18px;flex:1;letter-spacing:.5px}
header input{width:42%;max-width:170px;padding:7px 10px;border-radius:8px;border:0;background:rgba(255,255,255,.18);color:var(--pt);font-size:14px}
header input::placeholder{color:var(--pt);opacity:.7}
main{padding:14px;max-width:640px;margin:0 auto}
h3{margin:18px 0 8px;font-size:15px;color:var(--mu);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.seg{display:flex;background:var(--sh);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:12px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:17px}
.seg button.on{background:var(--pr);color:var(--pt)}
.big{width:100%;margin:12px 0;padding:18px;border:0;border-radius:14px;background:var(--pr);color:var(--pt);font-size:19px;font-weight:700}
.gh{padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);font-weight:600}
.pri{padding:11px 14px;border:0;border-radius:10px;background:var(--pr);color:var(--pt);font-weight:600}
input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);font:inherit}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}.row label{margin:0;white-space:nowrap}.row input{max-width:90px}
.r2{display:flex;gap:10px}.r2>div{flex:1}
.it{display:flex;align-items:center;gap:10px;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.it.low{border-color:var(--wt);background:var(--wb)}
.inf{flex:1;min-width:0}.inf b{display:block}.inf small{color:var(--mu)}.it.low .inf small{color:var(--wt)}
.ct{display:flex;align-items:center;gap:6px}.ct span{min-width:34px;text-align:center;font-weight:700;font-size:18px}
.ct button{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);font-size:22px;line-height:1}
.lg{display:flex;gap:8px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--bd)}.lg .d{font-weight:700;min-width:30px}.lg .p{color:var(--pr)}.lg .m{color:var(--rd)}.lg small{color:var(--mu);display:block}
.lg.x{opacity:.45;text-decoration:line-through}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;padding:10px 0 9px;font-size:12px;color:var(--mu)}nav button i{display:block;font-style:normal;font-size:22px}
nav button.on{color:var(--pr);font-weight:700}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mo[hidden],#t[hidden]{display:none}
.box{background:var(--cd);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.box h3{margin:0 0 6px;font-size:18px;color:var(--tx)}
.acts{display:flex;gap:8px;margin-top:14px}.acts>*{flex:1}
#camw{flex-direction:column;align-items:stretch;justify-content:center;gap:12px;padding:14px}
#v{width:100%;max-height:70%;border-radius:14px;background:#000;object-fit:cover}
#camw .hint{color:#fff;text-align:center}
#t{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#14262b;color:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:30}
#t span{flex:1}#t button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600}
.labs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.lab{background:#fff;color:#000;border:1px dashed #999;border-radius:6px;padding:8px;text-align:center;font-size:13px;font-weight:600;break-inside:avoid}
.lab svg{max-width:100%;height:auto;display:block;margin:4px auto 0}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}.chk input{width:20px;height:20px}
.mu{color:var(--mu);font-size:13px}.empty{text-align:center;color:var(--mu);padding:26px 0}
@media print{body::before,header,nav,#t,.noprint{display:none!important}main{padding:0;max-width:none}.lab{border-color:#ccc}}
</style></head><body>
<header><b>📦 StockScan</b><input id="usr" placeholder="Your name" autocomplete="off"></header>
<main id="main"></main>
<nav id="nav">
<button data-a="tab" data-i="scan"><i>📷</i>Scan</button>
<button data-a="tab" data-i="stock"><i>🗄️</i>Stock</button>
<button data-a="tab" data-i="label"><i>🏷️</i>Labels</button>
<button data-a="tab" data-i="log"><i>🕘</i>Log</button>
</nav>
<div id="m" class="mo" hidden></div>
<div id="camw" class="mo" hidden><video id="v" playsinline muted></video><div class="hint">Point at a barcode. Scanning continuously.</div><button class="gh" data-a="stopcam">Close camera</button></div>
<div id="t" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script>
const $=s=>document.querySelector(s),K="stockscan.preview.v2";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const seed=[["K-file #15 25mm","Endo files",14,6],["K-file #20 25mm","Endo files",5,6],["Gutta-percha #30","Obturation",3,4],["Paper points #25","Obturation",20,8],["Rubber dam sheets","Isolation",30,10],["NaOCl 5%","Irrigants",2,2],["Lidocaine cartridges","Pharmaceuticals",18,10],["Exam gloves M","Infection control",6,5]];
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.items){S={user:"",mode:"out",seq:seed.length,log:[],items:seed.map((x,i)=>{const id="SR-"+String(i+1).padStart(4,"0");return{id,name:x[0],cat:x[1],qty:x[2],min:x[3],codes:[id]}})}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let tab="scan",nq=1,pc="",ed=null,sel=null,cam={on:false},tt;
const get=id=>S.items.find(x=>x.id===id),find=c=>S.items.find(x=>x.codes.includes(c));

function toast(msg,undo){const t=$("#t");t.innerHTML="<span>"+esc(msg)+"</span>"+(undo?'<button data-a="undo">Undo</button>':"");t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,undo?4500:3000)}
function adj(it,d){const n=Math.max(0,it.qty+d);d=n-it.qty;it.qty=n;S.log.unshift({t:Date.now(),u:S.user||"Unnamed",n:it.name,id:it.id,d,q:n});S.log=S.log.slice(0,300);save();render()}
function undo(){const e=S.log.find(x=>!x.x);if(!e)return;const it=get(e.id);if(it)it.qty=Math.max(0,it.qty-e.d);e.x=1;save();render();toast("Undone: "+e.n)}
function handle(code){code=String(code).trim();if(!code)return;const it=find(code);
 if(it){const d=(S.mode==="in"?1:-1)*Math.max(1,nq|0);adj(it,d);if(navigator.vibrate)navigator.vibrate(40);
  toast((d>0?"Received +":"Taken out −")+Math.abs(d)+": "+it.name+". On hand: "+it.qty+(it.qty<=it.min?" ⚠ Low stock":""),true)}
 else{stopCam();pc=code;modal('<h3>Barcode not found</h3><p class="mu">'+esc(code)+'</p><div class="acts"><button class="pri" data-a="bindnew">Add new item</button></div><label>Or link it to an existing item</label><select id="bsel">'+S.items.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join("")+'</select><div class="acts"><button class="gh" data-a="close">Cancel</button><button class="pri" data-a="bindex">Link and record</button></div>')}}

async function startCam(){const v=$("#v");$("#camw").hidden=false;
 try{if("BarcodeDetector"in window){const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});v.srcObject=st;await v.play();cam.st=st;cam.on=true;
   const det=new BarcodeDetector({formats:["code_128","ean_13","ean_8","upc_a","upc_e","code_39","qr_code"]});
   const loop=async()=>{if(!cam.on)return;try{const r=await det.detect(v);if(r[0])got(r[0].rawValue)}catch(e){}setTimeout(loop,150)};loop()}
  else if(window.ZXing){cam.rd=new ZXing.BrowserMultiFormatReader();cam.on=true;cam.rd.decodeFromVideoDevice(undefined,"v",r=>{if(r)got(r.getText())})}
  else throw 0}catch(e){stopCam();toast("Live camera is blocked here. Use “Photo scan” instead.")}}
function got(c){const n=Date.now();if(c===cam.last&&n-cam.t<1500)return;cam.last=c;cam.t=n;handle(c)}
function stopCam(){cam.on=false;if(cam.st){cam.st.getTracks().forEach(t=>t.stop());cam.st=null}if(cam.rd){try{cam.rd.reset()}catch(e){}cam.rd=null}$("#v").srcObject=null;$("#camw").hidden=true}

function modal(h){const m=$("#m");m.innerHTML='<div class="box">'+h+"</div>";m.hidden=false}
const closeM=()=>{$("#m").hidden=true};
function editor(it,codes){ed=it?it.id:null;const c=codes||(it?it.codes.filter(x=>x!==it.id):[]);
 modal("<h3>"+(it?"Edit item":"New item")+'</h3><label>Name</label><input id="f_n" value="'+esc(it?it.name:"")+'"><label>Category</label><input id="f_c" list="cats" value="'+esc(it?it.cat:"")+'"><datalist id="cats">'+[...new Set(S.items.map(x=>x.cat))].map(x=>'<option value="'+esc(x)+'">').join("")+'</datalist><div class="r2"><div><label>On hand</label><input id="f_q" type="number" min="0" value="'+(it?it.qty:0)+'"></div><div><label>Minimum stock</label><input id="f_m" type="number" min="0" value="'+(it?it.min:0)+'"></div></div><label>Manufacturer barcodes (comma-separated, optional)</label><input id="f_b" value="'+esc(c.join(","))+'">'+(it?'<p class="mu">Internal barcode '+it.id+". Print it from the Labels tab.</p>":'<p class="mu">An internal barcode is created when you save. Print it and stick it on the drawer.</p>')+'<div class="acts">'+(it?'<button class="gh" data-a="del">Delete</button>':"")+'<button class="gh" data-a="close">Cancel</button><button class="pri" data-a="saveit">Save</button></div>')}
function saveIt(){const n=$("#f_n").value.trim();if(!n){toast("Enter a name");return}
 const extra=$("#f_b").value.split(/[,，\s]+/).map(x=>x.trim()).filter(Boolean);
 const dup=extra.find(c=>{const o=find(c);return o&&o.id!==ed});if(dup){toast("Barcode "+dup+" already belongs to “"+find(dup).name+"”");return}
 let it=ed?get(ed):null;if(!it){const id="SR-"+String(++S.seq).padStart(4,"0");it={id,codes:[id]};S.items.push(it)}
 it.name=n;it.cat=$("#f_c").value.trim()||"Uncategorized";it.qty=Math.max(0,+$("#f_q").value||0);it.min=Math.max(0,+$("#f_m").value||0);it.codes=[it.id,...extra];
 save();closeM();render();if(pc){const c=pc;pc="";handle(c)}}

const A={tab(i){tab=i;render()},mode(i){S.mode=i;save();render()},cam:startCam,stopcam:stopCam,
 inc(i){adj(get(i),1)},dec(i){adj(get(i),-1)},edit(i){editor(get(i))},new(){pc="";editor(null)},undo,close(){pc="";closeM()},
 saveit:saveIt,del(){const it=get(ed);if(it&&confirm("Delete “"+it.name+"”?")){S.items=S.items.filter(x=>x!==it);save();closeM();render()}},
 bindnew(){const c=pc;closeM();editor(null,[c])},
 bindex(){const it=get($("#bsel").value);if(it&&!it.codes.includes(pc))it.codes.push(pc);save();closeM();const c=pc;pc="";handle(c)},
 gen(){sel=[...document.querySelectorAll(".lsel:checked")].map(x=>x.value);drawLabels()},
 all(){document.querySelectorAll(".lsel").forEach(x=>x.checked=true)},
 print(){window.print()},reset(){if(confirm("Restore sample data? Current data will be erased.")){localStorage.removeItem(K);location.reload()}}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i)});
document.addEventListener("input",e=>{if(e.target.id==="usr"){S.user=e.target.value;save()}else if(e.target.id==="n")nq=+e.target.value||1;else if(e.target.id==="q"||e.target.id==="lo")listStock()});
document.addEventListener("change",e=>{if(e.target.id==="lo")listStock()});
document.addEventListener("keydown",e=>{
 if(e.target.id==="man"&&e.key==="Enter"){handle(e.target.value);e.target.value="";return}
 if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||!$("#m").hidden)return;
 const n=Date.now();if(n-(A.lt||0)>100)A.buf="";A.lt=n;
 if(e.key==="Enter"){if((A.buf||"").length>=3)handle(A.buf);A.buf=""}else if(e.key.length===1)A.buf=(A.buf||"")+e.key});

document.addEventListener("change",async e=>{if(e.target.id!=="pic"||!e.target.files[0])return;const f=e.target.files[0];e.target.value="";const url=URL.createObjectURL(f);let code=null;
 try{if("BarcodeDetector"in window){const r=await new BarcodeDetector().detect(await createImageBitmap(f));if(r[0])code=r[0].rawValue}
  if(!code&&window.ZXing){const r=await new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url);code=r.getText()}}catch(err){}
 URL.revokeObjectURL(url);if(code)handle(code);else toast("No barcode found. Move closer, focus, and try again.")});
function recent(n){const l=S.log.slice(0,n);return l.length?l.map(row).join(""):'<div class="empty">No activity yet. Scan a barcode to try it.</div>'}
function row(e){return'<div class="lg'+(e.x?" x":"")+'"><span class="d '+(e.d>0?"p":"m")+'">'+(e.d>0?"+":"")+e.d+"</span><div><b>"+esc(e.n)+"</b> now "+e.q+"<small>"+new Date(e.t).toLocaleString("en-AU",{hour12:false})+" · "+esc(e.u)+"</small></div></div>"}
function vScan(){const o=S.mode==="out";return'<div class="seg"><button data-a="mode" data-i="out" class="'+(o?"on":"")+'">Take out −</button><button data-a="mode" data-i="in" class="'+(o?"":"on")+'">Receive +</button></div><div class="row"><label>Quantity per scan</label><input id="n" type="number" min="1" value="'+nq+'"></div><button class="big" data-a="cam">📷 Open camera scanner</button><label class="gh" style="text-align:center;margin:0 0 12px">📸 Photo scan (use if live camera won’t open)<input id="pic" type="file" accept="image/*" capture="environment" hidden></label><input id="man" placeholder="Scanner gun, or type a barcode and press Enter" autocomplete="off" inputmode="text"><p class="mu">With a USB scanner on a computer, just scan. No need to click the box first.</p><h3>Recent activity</h3>'+recent(6)}
function vStock(){return'<input id="q" placeholder="Search name, category or barcode" autocomplete="off"><div class="row"><label><input id="lo" type="checkbox" style="width:auto;margin-right:6px">Low stock only</label><span style="flex:1"></span><button class="pri" data-a="new">+ New item</button></div><div id="lst"></div><p class="mu"><button class="gh" data-a="reset">Restore sample data</button></p>'}
function listStock(){const q=($("#q").value||"").toLowerCase(),lo=$("#lo").checked;
 const r=S.items.filter(x=>(!lo||x.qty<=x.min)&&(!q||(x.name+x.cat+x.codes.join(" ")).toLowerCase().includes(q))).sort((a,b)=>(b.qty<=b.min)-(a.qty<=a.min)||a.cat.localeCompare(b.cat));
 $("#lst").innerHTML=r.length?r.map(x=>'<div class="it'+(x.qty<=x.min?" low":"")+'"><div class="inf" data-a="edit" data-i="'+x.id+'"><b>'+esc(x.name)+"</b><small>"+esc(x.cat)+" · min "+x.min+(x.qty<=x.min?" · reorder":"")+'</small></div><div class="ct"><button data-a="dec" data-i="'+x.id+'">−</button><span>'+x.qty+'</span><button data-a="inc" data-i="'+x.id+'">+</button></div></div>').join(""):'<div class="empty">No matching items</div>'}
function vLabel(){return'<p class="mu noprint">Each item has an internal Code 128 barcode to stick on its drawer. The LS2208 scanner reads 1D barcodes only, so labels are not QR codes.</p><div class="noprint">'+S.items.map(x=>'<label class="chk"><input class="lsel" type="checkbox" value="'+x.id+'"'+(!sel||sel.includes(x.id)?" checked":"")+"> "+esc(x.name)+"</label>").join("")+'<div class="acts"><button class="gh" data-a="all">Select all</button><button class="pri" data-a="gen">Generate labels</button><button class="gh" data-a="print">Print</button></div></div><div class="labs" id="labs"></div>'}
function drawLabels(){const L=$("#labs");if(!L)return;const ids=sel||S.items.map(x=>x.id);L.innerHTML=ids.map(i=>get(i)).filter(Boolean).map(x=>'<div class="lab">'+esc(x.name)+'<svg class="bc" data-c="'+x.id+'"></svg></div>').join("");
 document.querySelectorAll(".bc").forEach(s=>{try{JsBarcode(s,s.dataset.c,{format:"CODE128",height:46,displayValue:true,fontSize:14,margin:2,background:"#ffffff",lineColor:"#000000"})}catch(e){}})}
function vLog(){return'<div class="row"><b style="flex:1">Activity log</b><button class="gh" data-a="undo">Undo last</button></div>'+recent(100)}
function render(){$("#usr").value=S.user;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.i===tab));
 $("#main").innerHTML=({scan:vScan,stock:vStock,label:vLabel,log:vLog})[tab]();if(tab==="stock")listStock();if(tab==="label")drawLabels()}
render();
</script></body></html>
